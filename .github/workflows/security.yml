# Security scans (roadmap §7): secrets (Gitleaks, full history), Python and npm dependency audits.
name: security

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history
      - name: Install gitleaks (pinned binary)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan repository history
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export locked requirements
        run: uv export --locked --no-hashes --no-emit-workspace --format requirements-txt > requirements-audit.txt
      - name: Audit Python dependencies
        run: uvx pip-audit --strict -r requirements-audit.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
