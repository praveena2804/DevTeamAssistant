# Continuous integration for the generated application (delivered as a file; DevTeam AI never runs it).
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi==0.165.0 uvicorn==0.54.0 pydantic==2.14.3 sqlalchemy==2.1.9 alembic==1.20.1 httpx==0.28.1 pytest==9.2.0
      - run: python -m pytest
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./data/ci.db
