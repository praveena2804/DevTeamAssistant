# Capability Catalog (Spec §13; roadmap §13 Part G; PART-G-PLAN §6.1-§6.2).
#
# What the platform can build. Checked at start-up against capabilities.schema.json, the closed
# CatalogKey enum (devteam_core.contracts.catalog), the starter kits and the recipe registry; an invalid
# file stops the worker and the API (fail closed).
#
# The declared `status` is never trusted on its own: an entry is effectively available only when its
# starter kit exists, its recipes are registered and a passing, current template verification exists.
# Otherwise it is demoted, with the reason shown in the report and on the Settings page.
#
# Changing this file is a reviewed code change: a new key needs a CatalogKey member and tests.
# Aliases are exact, lower-case phrases matched against the names the BRD Analyst extracts (never raw
# BRD text); they are unique within a category.
version: 1

# Spec §13.2 "SQL" rule: wording that names no engine. It is never mapped to an enterprise product;
# SQLite is offered (pending the user's acceptance) and a clarification gap is raised.
ambiguous_database_aliases:
  - sql
  - a sql database
  - sql database
  - relational database
  - a relational database
  - rdbms
  - database
  - a database
  - db

entries:
  # ------------------------------------------------------------------------------------------ frontend
  - key: html_css_js
    display_name: HTML, CSS and JavaScript
    category: frontend
    status: supported
    templates: [html_fastapi_sqlite]
    generation_adapter: html_frontend
    build_recipe: static_validation
    test_recipes: [pytest_api]
    runtime_requirements: [a modern web browser]
    known_limitations: [plain pages served by the generated FastAPI backend; no frontend framework]
    aliases: [html, html/css/js, html css javascript, html css js, javascript, vanilla javascript, plain html, static html, web page, web pages]
    documentation_ref: capability_catalog/README.md
  - key: react_vite
    display_name: React (Vite, TypeScript)
    category: frontend
    status: supported
    compatible_versions: ["19"]
    templates: [react_fastapi_sqlite]
    generation_adapter: react_frontend
    build_recipe: npm_build
    test_recipes: [tsc_check, vitest_run]
    runtime_requirements: [a modern web browser]
    aliases: [react, reactjs, react.js, react js, react vite, vite react, react typescript]
    documentation_ref: capability_catalog/README.md
  - key: angular
    display_name: Angular
    category: frontend
    status: unsupported
    known_limitations: [no Angular starter kit, generator or verification recipe]
    substitutions: [react_vite, html_css_js]
    aliases: [angular, angularjs, angular.js]
    documentation_ref: capability_catalog/README.md
  - key: vue
    display_name: Vue
    category: frontend
    status: unsupported
    known_limitations: [no Vue starter kit, generator or verification recipe]
    substitutions: [react_vite, html_css_js]
    aliases: [vue, vuejs, vue.js, nuxt]
