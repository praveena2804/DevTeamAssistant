  - key: power_apps_canvas
    display_name: Power Apps canvas app
    category: frontend
    status: unsupported
    required_credentials: [Microsoft 365 / Power Platform licence]
    network_requirement: credentialed
    known_limitations: [a proprietary, licensed low-code platform; it cannot be generated or tested locally]
    substitutions: [react_vite, html_css_js]
    aliases: [power apps, powerapps, power apps canvas, canvas app, microsoft power apps]
