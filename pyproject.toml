# DevTeam AI — uv workspace root (roadmap §7, §8; decision D-26 option (a), proceeding on recommended default).
# The ten agent packages (agents/<name>/, D-26) are workspace members. Adding an eleventh is prohibited (ADR-0002);
# scripts/check_agent_count.py enforces it.

[project]
name = "devteam-ai"
version = "0.4.0"
description = "DevTeam AI platform — local-first, BRD-driven software development platform (workspace root)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "devteam-core",
    "devteam-state",
    "devteam-harness",
    "devteam-services",
    "devteam-api",
    "devteam-orchestration",
    "devteam-worker",
    "devteam-agent-brd-analyst",
    "devteam-agent-requirements-finalizer",
    "devteam-agent-head",
    "devteam-agent-architect",
    "devteam-agent-database-developer",
    "devteam-agent-backend-developer",
    "devteam-agent-frontend-developer",
    "devteam-agent-tester",
    "devteam-agent-debugger-reviewer",
    "devteam-agent-documenter",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/state",
    "packages/harness",
    "packages/services",
    "apps/api",
    "packages/orchestration",
    "apps/worker",
    "agents/brd_analyst",
    "agents/requirements_finalizer",
    "agents/head",
    "agents/architect",
    "agents/database_developer",
    "agents/backend_developer",
    "agents/frontend_developer",
    "agents/tester",
    "agents/debugger_reviewer",
    "agents/documenter",
]

[tool.uv.sources]
devteam-core = { workspace = true }
devteam-state = { workspace = true }
devteam-harness = { workspace = true }
devteam-services = { workspace = true }
devteam-api = { workspace = true }
devteam-orchestration = { workspace = true }
devteam-worker = { workspace = true }
devteam-agent-brd-analyst = { workspace = true }
devteam-agent-requirements-finalizer = { workspace = true }
devteam-agent-head = { workspace = true }
devteam-agent-architect = { workspace = true }
devteam-agent-database-developer = { workspace = true }
devteam-agent-backend-developer = { workspace = true }
devteam-agent-frontend-developer = { workspace = true }
devteam-agent-tester = { workspace = true }
devteam-agent-debugger-reviewer = { workspace = true }
devteam-agent-documenter = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-PyYAML>=6.0",
    "psutil>=6.1",
    "types-psutil>=6.1",
    "pre-commit>=4.0",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "data", "workspaces", "templates"]  # templates: generated-app code, checked in the sandbox

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "TID", "PTH", "C4", "PL"]
ignore = [
    "PLR0913",  # explicit argument lists are preferred in factories
    "PLR2004",  # magic values are acceptable in tests and limits read from config
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607", "S608"]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607", "S608"]
"scripts/**" = ["S603", "S607", "T201"]
"**/migrations/versions/*.py" = ["N999"]
# Part E: "/tmp" in these files is a path INSIDE the sandbox container (a noexec tmpfs), not a host temp dir.
"packages/harness/src/devteam_harness/sandbox/spec.py" = ["S108"]
"tests/sandbox/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607", "S608", "S108", "PLR0917"]
"tests/security/test_sandbox_units.py" = ["S101", "PLR2004", "S108"]
"sandbox/tools/devteam_static_check.py" = ["PLR0912"]

[tool.ruff.lint.isort]
known-first-party = [
    "devteam_core", "devteam_state", "devteam_harness", "devteam_services", "devteam_api", "devteam_agents",
    "devteam_orchestration", "devteam_worker",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
# Banned-API rules for agents/** live in agents/ruff.toml (roadmap §5.3), which extends this file.

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = [
    "packages/core/src", "packages/state/src", "packages/harness/src", "packages/services/src", "apps/api/src",
    "packages/orchestration/src", "apps/worker/src",
    "agents/brd_analyst/src",
    "agents/requirements_finalizer/src",
    "agents/head/src",
    "agents/architect/src",
    "agents/database_developer/src",
    "agents/backend_developer/src",
    "agents/frontend_developer/src",
    "agents/tester/src",
    "agents/debugger_reviewer/src",
    "agents/documenter/src",
]
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
exclude = ["^apps/web/", "/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "pdfplumber.*", "docx.*", "lxml.*", "docker.*"]  # docker: no stubs shipped (Part E)
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["packages", "apps/api", "apps/worker", "tests"]
pythonpath = ["."]
markers = [
    "integration: cross-module tests using temp SQLite and fakes",
    "contract: schema/OpenAPI snapshot tests",
    "security: security suite (permanent CI gate from Part C)",
    "docker: requires a running Docker engine",
    "llm: requires local Ollama (never in CI)",
    "slow: long end-to-end tests",
    "acceptance: Spec §23 acceptance scenarios (Part R)",
    "keyring: touches the real OS keyring (Windows Credential Manager) under a throw-away service name",
]
filterwarnings = ["error::DeprecationWarning:devteam_.*"]

[tool.coverage.run]
branch = true
source = [
    "devteam_core", "devteam_state", "devteam_harness", "devteam_services", "devteam_api", "devteam_agents",
    "devteam_orchestration", "devteam_worker",
]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ---------------------------------------------------------------- import-linter (roadmap §7.1)
[tool.importlinter]
root_packages = [
    "devteam_core", "devteam_state", "devteam_harness", "devteam_services", "devteam_api", "devteam_agents",
    "devteam_orchestration", "devteam_worker",
]
include_external_packages = true  # needed to forbid HTTP clients and SQL libraries (Part C)

[[tool.importlinter.contracts]]
name = "devteam_core depends on no internal package"
type = "forbidden"
source_modules = ["devteam_core"]
forbidden_modules = ["devteam_state", "devteam_harness", "devteam_services", "devteam_api"]

[[tool.importlinter.contracts]]
name = "devteam_state may depend only on devteam_core"
type = "forbidden"
source_modules = ["devteam_state"]
forbidden_modules = ["devteam_harness", "devteam_services", "devteam_api"]

[[tool.importlinter.contracts]]
name = "devteam_harness must not depend on services or apps (roadmap 7.1)"
type = "forbidden"
source_modules = ["devteam_harness"]
forbidden_modules = ["devteam_services", "devteam_api"]

[[tool.importlinter.contracts]]
name = "devteam_services must not depend on apps (roadmap 7.1)"
type = "forbidden"
source_modules = ["devteam_services"]
forbidden_modules = ["devteam_api"]

# ---- Part C.4: agent isolation (CLAUDE.md §5, roadmap §5.3, AC-C-04)

[[tool.importlinter.contracts]]
name = "agents may import only devteam_core and devteam_harness.agent_sdk"
type = "forbidden"
source_modules = ["devteam_agents"]
forbidden_modules = [
    "devteam_state", "devteam_services", "devteam_api",
    "devteam_harness.approvals",
    "devteam_harness.audit",
    "devteam_harness.budgets",
    "devteam_harness.errors",
    "devteam_harness.executor",
    "devteam_harness.guardrails",
    "devteam_harness.iam",
    "devteam_harness.llm_gateway",
    "devteam_harness.observability",
    "devteam_harness.prompts",
    "devteam_harness.ratelimit",
    "devteam_harness.resilience",
    "devteam_harness.secrets",
    "devteam_harness.tools",
    "devteam_harness.validation",
    "httpx", "sqlalchemy", "keyring", "psutil", "yaml", "opentelemetry",
]
allow_indirect_imports = true  # agent_sdk itself uses harness internals; agents may not import them

[[tool.importlinter.contracts]]
name = "the ten agents are independent of each other"
type = "independence"
modules = [
    "devteam_agents.brd_analyst",
    "devteam_agents.requirements_finalizer",
    "devteam_agents.head",
    "devteam_agents.architect",
    "devteam_agents.database_developer",
    "devteam_agents.backend_developer",
    "devteam_agents.frontend_developer",
    "devteam_agents.tester",
    "devteam_agents.debugger_reviewer",
    "devteam_agents.documenter",
]

[[tool.importlinter.contracts]]
name = "only llm_gateway.providers may import HTTP clients (HC-02)"
type = "forbidden"
source_modules = [
    "devteam_core", "devteam_state", "devteam_harness", "devteam_services", "devteam_agents",
    "devteam_orchestration", "devteam_worker",
]
forbidden_modules = ["httpx"]
ignore_imports = ["devteam_harness.llm_gateway.providers.** -> httpx"]
unmatched_ignore_imports_alerting = "none"

# ---- Part E.1: sandbox boundaries (Part E plan 3.1; D-50)

[[tool.importlinter.contracts]]
name = "only sandbox.engine may import the Docker SDK (HC-14)"
type = "forbidden"
source_modules = [
    "devteam_core", "devteam_state", "devteam_harness", "devteam_services", "devteam_agents",
    "devteam_orchestration", "devteam_worker", "devteam_api",
]
forbidden_modules = ["docker", "requests"]
ignore_imports = [
    "devteam_harness.sandbox.engine -> docker",
    "devteam_harness.sandbox.engine -> docker.utils.proxy",
    "devteam_harness.sandbox.engine -> requests",
    "devteam_harness.sandbox.engine -> requests.adapters",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "agents, orchestration, API and worker never touch the Docker engine directly"
type = "forbidden"
source_modules = ["devteam_agents", "devteam_orchestration", "devteam_api", "devteam_worker"]
forbidden_modules = ["devteam_harness.sandbox.engine", "devteam_harness.sandbox.tls"]
allow_indirect_imports = true  # the sanctioned route is the sandbox service / tool layer; never a direct import

[[tool.importlinter.contracts]]
name = "the API never runs sandbox work (it only queues requests)"
type = "forbidden"
source_modules = ["devteam_api"]
forbidden_modules = ["devteam_harness.sandbox.service", "devteam_harness.sandbox.runner", "devteam_harness.sandbox.guard"]
allow_indirect_imports = true

# ---- Part D.1: orchestration and worker boundaries (roadmap 7.1, Part D plan 3.1)

[[tool.importlinter.contracts]]
name = "no orchestration, worker or LangGraph below the orchestration layer"
type = "forbidden"
source_modules = ["devteam_core", "devteam_state", "devteam_harness", "devteam_services", "devteam_agents"]
forbidden_modules = ["devteam_orchestration", "devteam_worker", "langgraph", "langchain_core", "langsmith"]

[[tool.importlinter.contracts]]
name = "orchestration must not depend on apps"
type = "forbidden"
source_modules = ["devteam_orchestration"]
forbidden_modules = ["devteam_api", "devteam_worker"]

[[tool.importlinter.contracts]]
name = "the API never runs graphs or agents directly"
type = "forbidden"
source_modules = ["devteam_api"]
forbidden_modules = ["devteam_agents", "devteam_worker", "langgraph", "langchain_core", "langsmith"]
allow_indirect_imports = true  # D.4: the API may call the orchestration run-command interface only

[[tool.importlinter.contracts]]
name = "the worker reaches agents only through orchestration"
type = "forbidden"
source_modules = ["devteam_worker"]
forbidden_modules = ["devteam_agents", "devteam_api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "runs never use the fake model provider (D-38)"
type = "forbidden"
source_modules = ["devteam_orchestration", "devteam_worker", "devteam_api", "devteam_agents"]
forbidden_modules = ["devteam_harness.llm_gateway.providers.fake"]
