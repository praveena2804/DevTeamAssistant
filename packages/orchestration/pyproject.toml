[project]
name = "devteam-orchestration"
version = "0.3.0"
description = "DevTeam AI LangGraph orchestration (HC-07): graph, routing, guards, checkpointing. Part D"
requires-python = ">=3.12,<3.13"
dependencies = [
    "devteam-core",
    "devteam-state",
    "devteam-harness",
    "devteam-services",
    "langgraph>=1.2.24,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.3,<3.2",
]

[tool.uv.sources]
devteam-core = { workspace = true }
devteam-state = { workspace = true }
devteam-harness = { workspace = true }
devteam-services = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devteam_orchestration"]
