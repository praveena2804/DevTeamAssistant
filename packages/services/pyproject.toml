[project]
name = "devteam-services"
version = "0.4.0"
description = "DevTeam AI deterministic services (not agents). Part B: workspace manager, document extraction, intake"
requires-python = ">=3.12,<3.13"
dependencies = [
    "devteam-core",
    "devteam-state",
    "devteam-harness",
    "pypdf>=5,<7",
    "pdfplumber>=0.11,<0.12",
    "python-docx>=1.1,<2",
    "charset-normalizer>=3.3,<4",
]

[tool.uv.sources]
devteam-core = { workspace = true }
devteam-state = { workspace = true }
devteam-harness = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devteam_services"]
