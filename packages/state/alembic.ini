# Alembic CLI configuration for data/state.db (domain truth). LangGraph checkpoints live in a separate
# database (data/checkpoints.db) that is NOT managed by Alembic (roadmap §6.1).
# Usage from the repository root:  uv run alembic -c packages/state/alembic.ini upgrade head
# The database URL is taken from the platform configuration (devteam_core.config), not from this file.
[alembic]
script_location = %(here)s/src/devteam_state/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
