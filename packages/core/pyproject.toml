[project]
name = "devteam-core"
version = "0.2.0"
description = "DevTeam AI shared foundation: configuration, logging, trace context, IDs, errors, paths (no internal dependencies)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devteam_core"]
