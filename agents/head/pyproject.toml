[project]
name = "devteam-agent-head"
version = "0.4.0"
description = "DevTeam AI agent 3 of 10: Head Agent. Declaration (AgentSpec) only; behaviour comes in later parts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "devteam-core",
    "devteam-harness",
]

[tool.uv.sources]
devteam-core = { workspace = true }
devteam-harness = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devteam_agents"]
