# Ruff rules for the ten agent packages (roadmap §5.3, CLAUDE.md §5; AC-C-04).
# Extends the root configuration and adds banned APIs: agents reach files, models, commands, the network
# and the database only through the harness (devteam_harness.agent_sdk). The AST rules in
# tests/security/test_agent_static_rules.py cover what imports cannot (open, eval, exec, getattr, ...).
extend = "../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"os".msg = "agents may not use os; use ctx.tools (harness)"
"subprocess".msg = "agents never run commands; the harness sandbox does (Part E)"
"shutil".msg = "agents may not touch files directly; use ctx.tools"
"socket".msg = "agents have no network access"
"pathlib".msg = "agents may not touch files directly; use ctx.tools"
"io".msg = "agents may not open streams; use ctx.tools"
"tempfile".msg = "agents may not create files; use ctx.tools"
"httpx".msg = "only llm_gateway.providers may use HTTP clients"
"requests".msg = "only llm_gateway.providers may use HTTP clients"
"urllib".msg = "agents have no network access"
"ollama".msg = "models are reached only through the LLM Gateway (ctx.llm)"
"sqlite3".msg = "agents have no database access"
"sqlalchemy".msg = "agents have no database access"
"importlib".msg = "dynamic imports are not allowed in agents"
"ctypes".msg = "not allowed in agents"
"pickle".msg = "not allowed in agents"
"keyring".msg = "secrets are never available to agents"
"devteam_state".msg = "agents have no database access"
"devteam_services".msg = "agents may import only devteam_core and devteam_harness.agent_sdk"
"devteam_api".msg = "agents may import only devteam_core and devteam_harness.agent_sdk"
"devteam_harness.tools".msg = "use ctx.tools"
"devteam_harness.llm_gateway".msg = "use ctx.llm"
"devteam_harness.executor".msg = "agents may import only devteam_harness.agent_sdk"
"devteam_harness.secrets".msg = "secrets are never available to agents"
"devteam_harness.guardrails".msg = "agents may import only devteam_harness.agent_sdk"
"devteam_harness.budgets".msg = "agents may import only devteam_harness.agent_sdk"
"devteam_harness.approvals".msg = "agents can never approve anything"
"devteam_harness.audit".msg = "agents may import only devteam_harness.agent_sdk"
"devteam_harness.iam".msg = "agents may import only devteam_harness.agent_sdk"
"devteam_harness.observability".msg = "agents may import only devteam_harness.agent_sdk"
"devteam_harness.prompts".msg = "agents may import only devteam_harness.agent_sdk"
"devteam_harness.resilience".msg = "agents may import only devteam_harness.agent_sdk"
"devteam_harness.agent_sdk.registry".msg = "the agent registry is for the platform, not for agents"
