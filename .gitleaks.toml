# Gitleaks configuration: the default ruleset plus a narrow allowlist.
# Only generated, gitignored directories are excluded (they are never committed). Synthetic test fixtures
# are marked inline with `gitleaks:allow`, never by disabling a rule.
title = "DevTeam AI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generated, gitignored local directories"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)__pycache__/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)\.mypy_cache/''',
  '''(^|/)\.ruff_cache/''',
  '''(^|/)\.hypothesis/''',
  '''^apps/web/dist/''',
  # Part E (D-50): the sandbox client key. Gitignored (data/), never committed, and stored only ENCRYPTED
  # (PKCS#8 AES-256; passphrase in Windows Credential Manager). Exactly this one file, nothing else in data/.
  '''^data/sandbox_tls/client-key\.enc\.pem$''',
]
