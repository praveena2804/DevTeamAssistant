# DevTeam AI — platform defaults (lowest precedence).
# Precedence: defaults.yaml < profiles/<profile>.yaml < .env < process environment (DEVTEAM_<SECTION>__<KEY>).
# Validated at startup by devteam_core.config.Settings (unknown keys are rejected).
profile: low_memory

api:
  host: 127.0.0.1
  port: 8000

paths:
  data_dir: data
  workspaces_dir: workspaces

database:
  state_db: state.db
  checkpoints_db: checkpoints.db
  busy_timeout_ms: 5000
  auto_migrate: true          # back up, then upgrade data/state.db on API start (Working Plan §11)

logging:
  level: INFO
  console_format: json        # json | console
  file_enabled: true
  file_name: devteam.log      # written under <data_dir>/logs/
  file_max_bytes: 10485760
  file_backup_count: 5

ollama:
  base_url: http://127.0.0.1:11434   # loopback only (Spec §9.1, roadmap P7)
  request_timeout_s: 600
  keep_alive: 1m                     # unload the model soon after use (Spec §9.3; one model at a time)
  models:                            # Part D (D-44): local models per slot, from the Part A benchmark
    instruct: qwen2.5:3b
    coder: qwen2.5-coder:3b
    review: qwen2.5:3b
    fallback: qwen2.5:1.5b

resources:
  max_parallel_deterministic: 1      # D-27 (recommended default; LLM and sandbox work always sequential)
  llm_context_tokens: 4096           # Spec §9.3 initial range 4096–8192
  min_free_ram_mb: 3072              # doctor warns below this

uploads:                             # HC-20 limits (Part B plan, approved AP-005)
  allowed_extensions: [".pdf", ".docx", ".txt", ".md"]   # D-22 (b)
  max_file_mb: 20
  max_files_per_upload: 10
  max_pdf_pages: 300
  max_docx_uncompressed_mb: 100      # zip-bomb protection (DOCX is a ZIP archive)
  max_docx_entries: 2000
  max_docx_compression_ratio: 100
  max_extracted_chars: 2000000
  chunk_target_chars: 1200
  chunk_max_chars: 2000

auth:                                # HC-15 local API token (D-29 (a))
  token_file: api_token              # legacy Part B location, read only by the D-18a migration
  cookie_name: devteam_session
  allowed_origins: ["http://127.0.0.1:5173", "http://localhost:5173"]

secrets:                             # HC-17 (D-18): Windows Credential Manager via keyring; no file fallback
  backend: keyring
  service_name: devteam-ai

files:                               # HC-06 Controlled File Service (F-9i, F-9j approved AP-008)
  max_write_bytes: 1048576           # 1 MB per file write
  max_task_write_bytes: 10485760     # 10 MB written per task
  max_read_bytes: 1048576
  max_list_entries: 2000

ratelimit:                           # HC-18 API limits, requests per minute
  enabled: true
  upload_per_minute: 10
  mutation_per_minute: 60
  session_per_minute: 10

orchestration:                       # HC-07/HC-19 run worker (Part D plan §3.6; D-40, D-41)
  recursion_limit: 200               # LangGraph recursion backstop (LG-05)
  poll_interval_s: 1                 # worker job polling
  heartbeat_interval_s: 5
  lease_ttl_s: 30                    # a worker lease older than this counts as dead
  max_crash_resumes: 3               # D-40: more consecutive crash-interrupted attempts -> task Blocked
  resource_wait_s: 60                # retry delay while WAITING_FOR_RESOURCES

sandbox:                             # HC-14 Docker sandbox (Part E; D-07 (b) Docker Engine in WSL2)
  enabled: true
  docker_host: tcp://127.0.0.1:2376  # D-50: WSL engine, loopback + mutual TLS only (nothing else accepted)
  wsl_distribution: Ubuntu-24.04     # used by the doctor and owner-run scripts only
  min_free_ram_mb: 2048              # below this, sandbox work waits for resources
  unload_models_before_run: true     # Spec §7.2: never an LLM and a container at the same time
  lock_ttl_s: 120                    # D-46 resource lease: older than this = holder died
  lock_wait_s: 900
  image_lock_path: sandbox/images/images.lock.json
  limits:                            # ceilings per container (plan §3.2, low_memory values)
    memory_mb: 1536
    cpus: 1.5
    pids: 256
    wall_clock_s: 600
    tmpfs_mb: 256
    work_copy_mb: 512
    output_kb: 1024
