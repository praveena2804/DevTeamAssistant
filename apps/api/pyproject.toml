[project]
name = "devteam-api"
version = "0.2.0"
description = "DevTeam AI platform API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "devteam-core",
    "devteam-state",
    "devteam-harness",
    "devteam-services",
    "fastapi>=0.115",
    "httpx>=0.28",  # in-process ASGI client for the D-18a migration checks (token_checks.py)
    "python-multipart>=0.0.18",
    "uvicorn>=0.32",
]

[tool.uv.sources]
devteam-core = { workspace = true }
devteam-state = { workspace = true }
devteam-harness = { workspace = true }
devteam-services = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devteam_api"]
