[project]
name = "devteam-api"
version = "0.1.0"
description = "DevTeam AI platform API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "devteam-core",
    "devteam-state",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv.sources]
devteam-core = { workspace = true }
devteam-state = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devteam_api"]
